# stock-ml-gcp — core config
# Locked decisions live here so code never hardcodes them in multiple places.

data:
  tickers: ["AAPL", "MSFT"]
  source: "yfinance"              # downloaded OHLCV source, recorded beside every raw snapshot
  start_date: "2018-01-01"        # enough history for 50-day indicators and time-aware splits
  end_date: null                   # null means the provider's most recently available trading day
  auto_adjust: false               # retain provider OHLCV values; cleaning/feature stages decide adjustments
  raw_layer: "data/raw"          # local path for now; GCS is a later, optional deployment decision
  processed_layer: "data/processed"

cleaning:
  required_columns: ["Open", "High", "Low", "Close", "Volume"]
  # Invalid or incomplete OHLCV rows are removed; no forward-fill is applied.
  drop_invalid_rows: true

target:
  # Direction label derived from forward return, not raw price.
  horizon_days: 1                # predict next N trading days' direction (finalize in Chat 5/6)
  buy_threshold: null            # e.g. +0.5% forward return -> BUY (set + document in feature/label chat)
  sell_threshold: null           # e.g. -0.5% forward return -> SELL (set + document in feature/label chat)

features:
  # Must stay stock-agnostic: normalized/relative, not raw price levels.
  rsi_period: 14
  volume_lookback: 20
  list:
    - close
    - volume
    - daily_return
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - volatility_20d
    - rsi
  model_columns:
    - close_to_sma_20
    - close_to_sma_50
    - volume_relative_20
    - daily_return
    - sma_20_to_sma_50
    - ema_12_to_ema_26
    - volatility_20d
    - rsi

split:
  method: "walk_forward"         # never random shuffle
  train_end: null                # set in Chat 6
  val_end: null                  # set in Chat 6

models:
  baseline: "logistic_regression"
  main: "random_forest"

decision_engine:
  # Rule-based, separate from model code (Chat 9)
  confidence_threshold: null
